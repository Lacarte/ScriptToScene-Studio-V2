<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      max-height: 500px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      background: #1a1a2e;
      color: #e0e0e0;
      overflow-y: auto;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      color: #e94560;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
    }
    .status-dot.connected { background: #4ade80; }

    .toolbar {
      display: flex;
      gap: 6px;
      padding: 10px 14px;
      border-bottom: 1px solid #0f3460;
    }
    .toolbar input {
      flex: 1;
      padding: 6px 10px;
      background: #16213e;
      border: 1px solid #0f3460;
      border-radius: 4px;
      color: #e0e0e0;
      font-size: 12px;
      outline: none;
    }
    .toolbar input:focus { border-color: #e94560; }
    .toolbar input::placeholder { color: #666; }

    .btn {
      padding: 6px 12px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:hover { background: #c73650; }
    .btn.secondary {
      background: transparent;
      border: 1px solid #0f3460;
      color: #aaa;
    }
    .btn.secondary:hover { border-color: #e94560; color: #e94560; }

    .tab-list {
      list-style: none;
      padding: 4px 0;
    }
    .tab-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      cursor: pointer;
      border-bottom: 1px solid #0f346020;
      transition: background 0.15s;
    }
    .tab-item:hover { background: #16213e; }
    .tab-item.active { background: #0f3460; }

    .tab-favicon {
      width: 16px;
      height: 16px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .tab-info {
      flex: 1;
      min-width: 0;
    }
    .tab-title {
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-url {
      font-size: 10px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-id {
      font-size: 10px;
      color: #555;
      flex-shrink: 0;
    }

    .empty {
      text-align: center;
      padding: 30px 14px;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>STS Orchestrator</h1>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Disconnected</span>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="searchInput" placeholder="Filter tabs...">
    <button class="btn secondary" id="refreshBtn">Refresh</button>
    <button class="btn secondary" id="reconnectBtn">WS</button>
  </div>

  <ul class="tab-list" id="tabList">
    <li class="empty">Loading tabs...</li>
  </ul>

  <script src="popup.js"></script>
</body>
</html>
